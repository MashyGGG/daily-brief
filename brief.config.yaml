# daily-brief — the single source of truth for content, recipients and timing.
#
# Rules that this file must obey (they are enforced by zod at load time, not by convention):
#   1. No secret VALUES ever live here — only `secretRef`, the NAME of an env var.
#   2. An invalid config fails the run. Nothing is silently skipped.
#   3. Private recipients that must not be committed go in the RECIPIENTS_OVERRIDE_JSON secret.
#   4. After changing `schedules[].time`, run `pnpm brief:schedule` and commit the workflow;
#      `pnpm check:schedule` fails the build if you forget.
#
# How to tune this file — read this before adding a source, the ranker is not what you think:
#   - RSS carries no score, so rank.ts gives every RSS item the 0.5 median. Inside a section
#     the order is therefore ONLY `weight × 新鲜度`. Ranking quality lives in `weight`.
#   - Read `weight` as "当这个源发文时,我有多想在早报里看到它". Rare-but-relevant sources
#     (react.dev, 阮一峰) get a HIGH weight precisely because they publish seldom.
#   - With `minPerSource: 1` a section hands out exactly one slot per source until `limit`
#     is full. So `limit` is really "今天最多出现几个不同的源", and a section holding more
#     sources than `limit` rotates: whoever published the strongest item today gets in.
#     That is deliberate — it is what stops Hacker News from eating the whole section.
#   - `staleAfterDays` 读作「多久没更新算可疑」，不是「多久没更新算失败」—— 超了只出一条
#     告警，不影响出报。默认 30 天，只有实测节奏本来就慢于此的源才写这个字段，写的值取自
#     2026-08-20 实测的「最新条目距今天数」。**别为了消掉告警随手调大它**，那等于把这个
#     检查关掉 —— 告警响了先去确认源本身是不是真的停更了。
#   - Every feed below was probed live on 2026-08-20: reachable, non-empty, UTF-8.
#     实测的「最新条目距今天数」记在 docs/SOURCES.md，那是 staleAfterDays 的取值依据。

timezone: Asia/Shanghai # renders all dates in this zone, and interprets `schedules[].time` in it
title: 每日早报

schedules:
  - id: morning
    # 07:10 CST = 23:10 UTC（前一日），生成的 cron 是 `10 23 * * *`。
    # 提前 50 分钟有两个原因，缺一不可：
    #   1. M2 的抓正文 + LLM 摘要会给运行时长净增 1–3 分钟；
    #   2. `:00` 和 `:30` 是全球 Actions 定时任务最拥挤的两个分钟，排队漂移最大。
    # 时间账（2026-08-28 用 Actions API 实测 28 次定时运行后重写，原估值两项都不准）：
    # 07:10 触发 + GitHub 派发漂移 23–25min + 运行 <1min ⇒ 常态 07:33–07:35 送达。
    # 「运行 3–5min」是高估：抓正文 + LLM 摘要实测全程 0.3–0.7min。
    # 「排队 0–20min」是低估，而且真正的变量不是分钟而是 UTC 小时 —— 23:xx UTC 是
    # 本仓所有档期里最空的一档，这也是 07:10 这个时间唯一值得守住的理由。
    # 详见 docs/SCHEDULE-DRIFT.md。
    # 改这一行之后必须跑 `pnpm brief:schedule`，否则 `pnpm check:schedule` 会让 CI 红。
    time: '07:10'
    lookbackHours: 24 # a skipped run loses nothing: the next one still sees the same window
    # ★ 白名单（决策 4）：新闻已经独立成 news-am / news-pm 两期，技术早晚报回归纯技术。
    # 不改则新闻栏一天被抓四遍。releases 当前 enabled: false，写进来只是为了将来
    # 重新打开它时不用记得回来补这一行。
    sections: [tech, ai, cn-tech, security, releases]
    recipients: ['*']
    enabled: true

  # 晚间一期：内容与早报完全相同（全部 sections、全部 recipients），只是时间不同。
  # 20:10 CST = 12:10 UTC 当天，生成的 cron 是 `10 12 * * *`。
  # 时间账（同上，实测重写）：20:10 触发 + 派发漂移 48–64min + 运行 <1min
  # ⇒ 常态 20:58–21:14 送达。这是所有日常档期里最差的一档：12:10 UTC 比 23:10 UTC
  # 拥挤得多，而避开 `:00` 这个分钟并没有救回来 —— 主导变量是小时，不是分钟。
  # 没有跟着挪走，是因为只有 5 天数据，挪到哪个小时会更好并不成立。
  # lookbackHours 13 = 从早报触发的 07:10 往前留一点余量，正好覆盖「早上发完之后
  # 新出的东西」。真有重叠也不会重复推送：跨天去重会读到当天 morning 那份归档 JSON
  # （archive.dedupeLookbackDays），今早已经发过的条目在这里会被丢掉。
  - id: evening
    time: '20:10'
    lookbackHours: 13
    sections: [tech, ai, cn-tech, security, releases] # 同 morning，理由见上
    recipients: ['*']
    enabled: true

  # ── 要闻期（docs/NEWS-EDITION.md）─────────────────────────────────────────────
  # 新闻从技术早晚报里独立出来，自己占一期：只跑 news / cn-news / cn-life 三栏，
  # 只发邮件。好处是新闻自带一套席位，不与技术栏抢 limit；代价是每天多两次 Actions。
  #
  # 07:40 CST = 23:40 UTC（前一日），生成的 cron 是 `40 23 * * *`。
  # 这次搬迁被实测证实是对的：旧的 09:10 CST = 01:10 UTC 实测迟到 72–88min，
  # 是本仓最差的一档；搬到 23:xx UTC 之后，同一档期的漂移量降到 morning 的水平。
  # 与 morning（07:10）只隔 30 分钟，这是安全的：两期栏目完全不相交（技术 vs 新闻），
  # 不存在互相去重；workflow 的 concurrency 组是排队而非取消，真撞上了只会晚发不会丢。
  # 顺带白捡半价：DeepSeek 峰时 = 工作日 09:00–12:00 / 14:00–18:00 CST，07:40 在谷时，
  # 而原来的 09:10 正好踩在峰时里（docs/LLM-VENDOR-CHOICE.md §4.1）。
  # lookbackHours 24：晚间那期若被跳过，早间这期仍然兜得住一整天。
  - id: news-am
    time: '07:40'
    lookbackHours: 24
    sections: [news, cn-news, cn-life]
    # 只发邮件（决策 3）：企微单条 4096 字节装不下 30 条要闻。企微哪天不用了，
    # 这行改回 ['*'] 即可 —— 席位是按邮件的长度容忍度定的，不是按企微。
    recipients: [me-mail]
    enabled: true

  # 19:10 CST = 11:10 UTC 当天，生成的 cron 是 `10 11 * * *`。
  # lookbackHours 12 上溯到 07:10，正好盖住 07:40 的 news-am 并多留 30 分钟，
  # 余量吸收 Actions 0–30 分钟的排队漂移 —— 两期窗口之间不留缝。
  # 与早间那期窗口重叠不会重复推送：跨天去重会读到当天 news-am 的归档 JSON
  # （archive.dedupeLookbackDays），早上已经发过的条目在这里会被丢掉。
  - id: news-pm
    time: '19:10'
    lookbackHours: 12
    sections: [news, cn-news, cn-life]
    recipients: [me-mail]
    enabled: true

sources:
  # ── 国际技术：讨论热度 ────────────────────────────────────────────────
  - name: hn-front
    type: hackernews
    weight: 1.3
    params: { mode: front_page, minPoints: 100, limit: 60 }

  - name: gh-trending-ts
    type: github
    weight: 1.0
    params: { language: typescript, createdWithinDays: 7, minStars: 50, limit: 30 }

  # Uncomment for a language-agnostic trending row (wider surface, more noise).
  # - name: gh-trending-any
  #   type: github
  #   weight: 0.9
  #   params: { createdWithinDays: 7, minStars: 200, limit: 30 }

  - name: lobsters
    type: rss
    weight: 0.9
    # excerpt 整条就是一个指向评论页的 <a>Comments</a>，剥完标签只剩这一个词。
    # 去掉之后这个源变成「有标题没摘要」—— 那是 §0.1 第 ③ 类病，只有 M2 抓正文能治。
    stripPatterns: ['^Comments$']
    params: { url: https://lobste.rs/rss }

  # ── 国际技术：架构与工程 ──────────────────────────────────────────────
  - name: bytebytego
    type: rss
    weight: 1.1
    params: { url: https://blog.bytebytego.com/feed } # 系统设计，日更

  - name: infoq-arch
    type: rss
    weight: 1.0
    params: { url: https://feed.infoq.com/architecture-design/ }

  - name: martinfowler
    type: rss
    weight: 1.2
    staleAfterDays: 90 # 今天 0.5 天前更新，但他一向能连着几个月不发
    stripPatterns: ['\s*more…\s*$'] # 摘要末尾的 "more…" 是「阅读全文」按钮，不是内容
    params: { url: https://martinfowler.com/feed.atom }

  - name: pragmatic-engineer
    type: rss
    weight: 1.1
    params: { url: https://newsletter.pragmaticengineer.com/feed } # 部分文章有付费墙

  # ── 前端本行：低频高相关，靠 weight 保住席位 ──────────────────────────
  # 若这几个源长期被日更源挤掉，把它们拆成独立 section（limit: 2）即可。
  # 这一组也是 staleAfterDays 最需要放宽的地方：官方博客一年发不了几次，用默认 30 天
  # 会天天误报。实测值（2026-08-20，距今天数）写在各自行内。
  - name: react-blog
    type: rss
    weight: 1.2
    staleAfterDays: 180 # 实测 0.5d，但 react.dev 一年只发几篇
    params: { url: https://react.dev/rss.xml }

  - name: chrome-dev
    type: rss
    weight: 1.2
    staleAfterDays: 120 # 实测 59d
    params: { url: https://developer.chrome.com/static/blog/feed.xml }

  - name: web-dev
    type: rss
    weight: 1.1
    staleAfterDays: 180 # 实测 83d —— 本仓库最接近「疑似停更」的源，值得盯
    params: { url: https://web.dev/static/blog/feed.xml }

  - name: ts-devblog
    type: rss
    weight: 1.1
    staleAfterDays: 120 # 实测 43d
    params: { url: https://devblogs.microsoft.com/typescript/feed/ }

  - name: css-tricks
    type: rss
    weight: 0.9
    params: { url: https://css-tricks.com/feed/ }

  # ── 运维 / 云 / 平台 ─────────────────────────────────────────────────
  - name: github-changelog
    type: rss
    weight: 1.0
    # WordPress 贴在每条 description 末尾的固定尾巴："The post <标题> appeared first on The GitHub Blog."
    # 它把 300 字预算里的几十字换成了一句重复的标题。锚在结尾，只吃这条尾巴。
    # `\s*\.?` and not `\.?`: the trailing period lives inside its own <a> in the feed, so
    # stripHtml leaves "The GitHub Blog ." with a space in front of the dot.
    stripPatterns: ['\s*The post .{0,200}?appeared first on The GitHub Blog\s*\.?\s*$']
    params: { url: https://github.blog/changelog/feed/ }

  - name: cloudflare
    type: rss
    weight: 0.9
    params: { url: https://blog.cloudflare.com/rss/ }

  - name: kubernetes
    type: rss
    weight: 1.0
    params: { url: https://kubernetes.io/feed.xml }

  # aws-whatsnew 日更 ~100 条且以服务/可用区公告为主，信噪比太低，默认不启用。
  # - name: aws-whatsnew
  #   type: rss
  #   weight: 0.6
  #   params: { url: https://aws.amazon.com/about-aws/whats-new/recent/feed/, limit: 60 }

  # ── 科技媒体（行业侧，不是硬技术） ────────────────────────────────────
  - name: verge
    type: rss
    weight: 0.7
    params: { url: https://www.theverge.com/rss/index.xml }

  - name: ars-technica
    type: rss
    weight: 0.7
    params: { url: https://feeds.arstechnica.com/arstechnica/index }

  # ── AI 工程 ─────────────────────────────────────────────────────────
  - name: simonwillison
    type: rss
    weight: 1.2
    params: { url: https://simonwillison.net/atom/everything/ } # LLM 工程实践，信噪比最高

  - name: openai
    type: rss
    weight: 1.1
    params: { url: https://openai.com/news/rss.xml, limit: 30 } # 全量 1000+ 条，必须限量

  - name: google-ai
    type: rss
    weight: 1.0
    params: { url: https://blog.google/technology/ai/rss/ }

  - name: deepmind
    type: rss
    weight: 0.9
    params: { url: https://deepmind.google/blog/rss.xml, limit: 30 }

  - name: huggingface
    type: rss
    weight: 0.9
    params: { url: https://huggingface.co/blog/feed.xml, limit: 30 }

  - name: latent-space
    type: rss
    weight: 1.1
    params: { url: https://www.latent.space/feed } # 工程向 AI newsletter + 播客，与上面五个不重合

  # Anthropic 仍然没有官方 RSS（/rss.xml 与 /news/rss.xml 都是 404）。曾用 Google News
  # 站内检索兜底，实测只回一条标题为「- Anthropic」的空壳条目，占席位不产内容，已放弃。
  # 现在改走第三方 RSSHub 镜像**试运行**：2026-08-20 实测 200、10 条、最新条目 8.6 天前。
  # 代价同 36kr-ai —— 这是别人的服务器，随时可能关停；挂了只留一条抓取告警，不影响出报。
  # 试运行期间 ai 栏 limit 从 3 提到 4；不留就删掉这个源并把 limit 调回 3。
  - name: anthropic
    type: rss
    weight: 1.1
    staleAfterDays: 60 # 镜像 + 官方发布本就不密集，实测 9d
    params: { url: https://rsshub.bestblogs.dev/anthropic/news }

  # ── 安全公告：唯一一类「不看会出事」的信息 ────────────────────────────
  - name: cisa-advisories
    type: rss
    weight: 1.0
    params: { url: https://www.cisa.gov/cybersecurity-advisories/all.xml, limit: 40 }

  - name: hacker-news-sec
    type: rss
    weight: 1.0
    params: { url: https://feeds.feedburner.com/TheHackersNews } # The Hacker News，与 HN 无关

  - name: krebs
    type: rss
    weight: 1.1
    params: { url: https://krebsonsecurity.com/feed/ }

  # ── 依赖发版：升级窗口与 breaking change 预警 ─────────────────────────
  # GitHub 的 releases.atom 是标准 Atom，现有 rss adapter 直接吃，零代码。
  # 条目标题是裸版本号（"v8.2.2"），靠渲染层带出的源名分辨是哪个仓库。
  - name: nextjs-releases
    type: rss
    weight: 1.2
    params: { url: https://github.com/vercel/next.js/releases.atom }

  - name: react-releases
    type: rss
    weight: 1.1
    staleAfterDays: 180 # 实测 30d，React 本来就发得稀
    params: { url: https://github.com/facebook/react/releases.atom }

  - name: typescript-releases
    type: rss
    weight: 1.1
    staleAfterDays: 240 # 实测 125d —— 全仓库最慢的源
    params: { url: https://github.com/microsoft/TypeScript/releases.atom }

  - name: node-releases
    type: rss
    weight: 1.1
    staleAfterDays: 60 # 实测 15d
    params: { url: https://github.com/nodejs/node/releases.atom }

  - name: spring-boot-releases
    type: rss
    weight: 1.0
    staleAfterDays: 120 # 实测 56d
    params: { url: https://github.com/spring-projects/spring-boot/releases.atom }

  # 下面三个是本仓库和日常开发真在用的工具链，breaking change 概率比框架本身还高。
  - name: pnpm-releases
    type: rss
    weight: 1.1
    staleAfterDays: 60 # 实测 2d
    params: { url: https://github.com/pnpm/pnpm/releases.atom }

  - name: vitest-releases
    type: rss
    weight: 1.1
    staleAfterDays: 60 # 实测 2d
    params: { url: https://github.com/vitest-dev/vitest/releases.atom }

  - name: eslint-releases
    type: rss
    weight: 1.0
    staleAfterDays: 60 # 实测 13d
    params: { url: https://github.com/eslint/eslint/releases.atom }

  # Vite 没接：本仓库不用，日常也是 Next.js 自带的构建链，接了只会稀释 releases 栏。

  # ── 中文技术 ────────────────────────────────────────────────────────
  # 掘金官方 RSS（https://juejin.cn/rss）在 runner 上不可用：2026-08-21→09-02 的 25 期里
  # **15 期返回 HTTP 200 + 0 条**（本机同一时刻能抓到 20 条、日期齐全）——是掘金按 IP 段
  # 对海外机房返回空壳，不是 feed 变形。改走 Google News 站内检索，理由是同一个 runner 上
  # 所有 `gn-*` 源 19/19 全勤，这条路径本身已经被证明可达。
  # 标题会被缀上「 - 稀土掘金」，必须去掉（理由同 thepaper 那段注释）。这里没有复用
  # `*gn-strip` 锚点：它定义在下面 news 栏，YAML 锚点必须先定义后引用。
  - name: juejin
    type: rss
    weight: 0.7
    stripPatterns:
      [
        '\s*[-–—]\s*[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+\s*$',
        '\s*[-–—]\s*[一-龥][一-龥A-Za-z0-9·]{1,14}( [A-Za-z][A-Za-z0-9.]{0,14}){0,2}\s*$',
        '\s*在\s*Google\s*新闻上查看更多头条新闻和观点\s*$',
      ]
    params:
      url: 'https://news.google.com/rss/search?q=when:24h+site:juejin.cn&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  # 36氪：官方 /feed 早已停更（现在返回 SPA 的 HTML 壳，不是 XML），走第三方 RSSHub
  # 镜像试运行。这是**别人的服务器**，随时可能关停 —— 挂了只会留一条抓取告警，不影响出报。
  # 走「人工智能·AI」专题而不是 /newsflashes：快讯是财经通稿（三大股指、ETF 成交额），
  # 且 20 条只覆盖 1.5 小时；这个专题是深度报道，跨度 16.7 小时，基本覆盖得住日更窗口。
  # 试运行结论和备选路由见 docs/CN-SOURCES.md。
  # 2026-09-02 换实例：原来的 rss.injahow.cn 在 25 期里挂了 5 次（20%，AbortError 超时为主），
  # 本机连测 4 次也有 1 次直接连不上。改指 rsshub.bestblogs.dev —— 本仓 `anthropic` 已经在用
  # 它，同期 25 期 0 失败；实测同一路由返回 20 条、内容就是原来那个「人工智能·AI」专题。
  # 风险模型不变：仍然是别人的服务器，只是换了一台被本仓验证过的。
  - name: 36kr-ai
    type: rss
    weight: 0.9
    params: { url: https://rsshub.bestblogs.dev/36kr/motif/327686782977 }

  # 微信公众号：没有任何官方开放接口，现有第三方方案在集体死亡。见 docs/CN-SOURCES.md §3。

  - name: solidot
    type: rss
    weight: 1.1
    params: { url: https://www.solidot.org/index.rss }

  - name: oschina
    type: rss
    weight: 0.9
    params: { url: https://www.oschina.net/news/rss }

  - name: infoq-cn
    type: rss
    weight: 1.0
    # feed 里的 description 恒为「点击查看原文>」，一个字的内容都没有。
    stripPatterns: ['点击查看原文>?']
    params: { url: https://www.infoq.cn/feed }

  - name: ruanyifeng
    type: rss
    weight: 1.3
    params: { url: http://www.ruanyifeng.com/blog/atom.xml } # 周更，所以权重给满

  - name: meituan-tech
    type: rss
    weight: 1.2
    params: { url: https://tech.meituan.com/feed/ }

  - name: zhangxinxu
    type: rss
    weight: 1.2
    staleAfterDays: 60 # 月更节奏，实测 6d
    params: { url: https://www.zhangxinxu.com/wordpress/feed/ } # 前端 CSS

  - name: sspai
    type: rss
    weight: 0.8
    stripPatterns: ['\s*查看全文\s*$'] # 摘要尾部的「查看全文」是按钮文案
    params: { url: https://sspai.com/feed }

  # ── 国际要闻（docs/NEWS-EDITION.md §2.1）──────────────────────────────
  # 权重按「LLM 未开」配：LLM_API_KEY 这个 secret 目前没配，llm.sections.news 那句
  # 中文 oneline 因此不存在，英文源进邮件就是原样英文 excerpt。所以中文源全部压在
  # 英文源之上 —— ★ 这是本文件里唯一一处「配上 key 那天要回来调平」的临时值。
  # 全部 14 个源在 2026-08-24 实测：可达、非空、UTF-8、最新条目龄期 ≤ 2.6 天。
  - name: bbc-zhongwen
    type: rss
    weight: 1.2
    params: { url: https://feeds.bbci.co.uk/zhongwen/simp/rss.xml }

  - name: nyt-cn
    type: rss
    weight: 1.1
    params: { url: https://cn.nytimes.com/rss.html } # 纽约时报中文网

  - name: rfi-zh
    type: rss
    weight: 1.0
    params: { url: https://www.rfi.fr/cn/rss } # 法广中文

  - name: un-news-zh
    type: rss
    weight: 0.9
    # 机构口径：联合国自己的通稿，与商业媒体的选题重叠很小。
    params: { url: https://news.un.org/feed/subscribe/zh/news/all/rss.xml }

  - name: bbc-world
    type: rss
    weight: 0.9
    params: { url: https://feeds.bbci.co.uk/news/world/rss.xml }

  - name: guardian-world
    type: rss
    weight: 0.8
    # 卫报把订阅推广直接写在 description 里，而且是在正文前面 —— 300 字预算里往往有
    # 一半花在「订阅我们的新闻邮件」上。三条都是 2026-08-21 实跑里逐字抄下来的。
    stripPatterns:
      [
        'Get our breaking news email\s*,?\s*free app or daily news podcast',
        'Sign up for the US Breaking News email',
        'Follow (today’s news live|our [^.]{0,60}? live blog for latest updates)',
      ]
    params: { url: https://www.theguardian.com/world/rss }

  - name: nyt-world
    type: rss
    weight: 0.8
    # 实测 58 条，是本栏最长的直连源；不调 params.limit，靠 section.limit 压。
    params: { url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml }

  - name: aljazeera
    type: rss
    weight: 0.8
    params: { url: https://www.aljazeera.com/xml/rss/all.xml }

  - name: nyt-home
    type: rss
    weight: 0.7
    # 头版，含非国际条目（美国国内 / 文化）。权重压在 nyt-world 之下就是为此。
    params: { url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml }

  - name: npr-news
    type: rss
    weight: 0.7
    params: { url: https://feeds.npr.org/1001/rss.xml } # 实测 10 条，条数克制

  - name: ft-world
    type: rss
    weight: 0.7
    params: { url: 'https://www.ft.com/world?format=rss' } # 财经视角看国际

  - name: economist-week
    type: rss
    weight: 0.7
    # 周刊，但 feed 里堆了 300 条历史条目 —— limit 必须显式写死，否则整栏会被这一个
    # 源的陈年条目灌满（新鲜度会压低它们的排名，但 minPerSource 之后的席位仍会被它吃掉）。
    params: { url: https://www.economist.com/the-world-this-week/rss.xml, limit: 50 }

  - name: gn-world-zh
    type: rss
    weight: 0.6
    # Google News 兜底源。三条 stripPatterns 由所有 gn-* 源共用（YAML 锚点），
    # 前两条缺一不可，见 docs/NEWS-EDITION.md §2.4②：
    #   1. 「 - thepaper.cn」这种 ASCII 域名后缀；
    #   2. 「 - 新华网客户端」「 - 中國報 China Press」这种中文来源名后缀 —— 第 1 条对它无效。
    #   3. excerpt 末尾的「在 Google 新闻上查看更多头条新闻和观点」，是按钮文案不是内容。
    # 前两条不去掉的后果不是难看：两条毫不相干的文章仅凭共享后缀就能把 4-gram 相似度
    # 刷到 0.327，比真正的跨源转载（0.286）还高，会把 dedupe.titleSimilarity 变成误杀器。
    # 中文那条要求后缀以中文开头、≤ 15 字、最多再跟两个拉丁词（"中國報 China Press"），
    # 避免吃掉正常标题里的破折号尾巴 —— 2026-08-24 的 dry-run 逐条对过。
    stripPatterns:
      &gn-strip [
        '\s*[-–—]\s*[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+\s*$',
        '\s*[-–—]\s*[一-龥][一-龥A-Za-z0-9·]{1,14}( [A-Za-z][A-Za-z0-9.]{0,14}){0,2}\s*$',
        '\s*在\s*Google\s*新闻上查看更多头条新闻和观点\s*$',
      ]
    params:
      url: 'https://news.google.com/rss/topics/CAAqKggKIiRDQkFTRlFvSUwyMHZNRGx1YlY4U0JYcG9MVU5PR2dKRFRpZ0FQAQ?hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: un-news-en
    type: rss
    weight: 0.6
    params: { url: https://news.un.org/feed/subscribe/en/news/all/rss.xml }

  # ── 国内要闻（docs/NEWS-EDITION.md §2.2）──────────────────────────────
  # chinanews 的 5 个频道（本节 3 个 + 民生栏 2 个）之间有重叠，靠 dedupe.titleSimilarity
  # 吃掉；重叠最大的 rss/scroll（全类目滚动）故意没接，它只会白占轮换位。
  - name: chinanews-import
    type: rss
    weight: 1.2
    params: { url: https://www.chinanews.com.cn/rss/importnews.xml } # 主源：要闻

  - name: chinanews-china
    type: rss
    weight: 1.1
    params: { url: https://www.chinanews.com.cn/rss/china.xml }

  # 界面新闻。官方 RSS（a.jiemian.com/index.php?m=article&a=rss）在 runner 上 19 期挂了 7 期
  # （37%，全是 `TypeError: fetch failed` —— 连接层直接断，本机同一时刻正常）。同 juejin，
  # 改走 Google News 站内检索：实测 100 条、标题就是界面自己的稿子。
  - name: jiemian
    type: rss
    # 1.0 -> 0.9：换成 Google News 转发之后，它的条目 URL 指向 news.google.com 跳转链接，
    # 跟直连源对不上 id、无法自动去重。本文件里所有 gn-* 源压在 <= 0.9 就是这个原因。
    weight: 0.9
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/search?q=when:24h+site:jiemian.com&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: thepaper
    type: rss
    weight: 0.9
    # Google News 的转发格式，标题和摘要都会被缀上「 - thepaper.cn」。必须去掉：两条毫不
    # 相干的澎湃文章仅凭这个共享后缀，就能在 4-gram 相似度上刷到 0.327 —— 比真正的跨源
    # 转载（0.286）还高，会把 dedupe.titleSimilarity 从去重器变成误杀器。
    stripPatterns: ['\s*[-–—]?\s*thepaper\.cn\s*$']
    params:
      url: 'https://news.google.com/rss/search?q=when:24h+site:thepaper.cn&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: chinanews-finance
    type: rss
    weight: 0.9
    # 路径是 finance.xml —— 站内链接上那个 rss/cj.xml 是 404，别照抄。
    params: { url: https://www.chinanews.com.cn/rss/finance.xml }

  - name: cna-zh
    type: rss
    weight: 0.8
    # 中央社，走 feedburner 第三方中转。与 36kr-ai 同一风险模型：中转随时可能停，
    # 挂了只留一条告警、不影响出报，所以权重先压在 0.8。
    params: { url: https://feeds.feedburner.com/rsscna/mainland }

  - name: gn-nation-zh
    type: rss
    weight: 0.8
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/topics/CAAqJggKIiBDQkFTRWdvSkwyMHZNR1F3TlhjekVnVjZhQzFEVGlnQVAB?hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: scmp-china
    type: rss
    weight: 0.7
    # 英文写中国，视角与前面几家互补；LLM 未开时它进邮件是英文，故压在 0.7。
    params: { url: https://www.scmp.com/rss/4/feed }

  - name: gn-business-zh
    type: rss
    weight: 0.7
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/topics/CAAqKggKIiRDQkFTRlFvSUwyMHZNRGx6TVdZU0JYcG9MVU5PR2dKRFRpZ0FQAQ?hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: yahoo-hk
    type: rss
    weight: 0.7
    params: { url: https://hk.news.yahoo.com/rss/hong-kong } # 港闻

  - name: gnews-cn
    type: rss
    # 0.8 → 0.6 降权：Google News 把「同题相关报道列表」塞进 description，实测 excerpt
    # 是「中农批宿迁市场：…东方财富 …观察者 …新浪财经」这样的纯噪音，而且长度 > 80，
    # 会撞上 llm.when.excerptShorterThan 被判为「源摘要已经够用」——
    # 就算将来配了 LLM_API_KEY 也永远不会被改写。
    weight: 0.6
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss?hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  # ── 民生·社会（docs/NEWS-EDITION.md §2.3）─────────────────────────────
  # 这一栏一半是 Google News 检索源：民生话题没有哪个官方 feed 能覆盖，检索是唯一
  # 拿得到面的方式。全部带 when:24h，权重一律 ≤ 0.9（它们与直连源之间无法自动去重）。
  - name: chinanews-society
    type: rss
    weight: 1.2
    params: { url: https://www.chinanews.com.cn/rss/society.xml } # 主源：社会

  - name: chinanews-life
    type: rss
    weight: 1.0
    params: { url: https://www.chinanews.com.cn/rss/life.xml } # 生活服务

  - name: gn-minsheng
    type: rss
    weight: 0.9
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/search?q=民生+OR+社保+OR+医保+OR+就业+OR+房价+OR+物价+when:24h&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: gn-disaster
    type: rss
    weight: 0.9
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/search?q=台风+OR+暴雨+OR+地震+OR+应急+OR+预警+when:24h&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: gn-govcn
    type: rss
    weight: 0.8
    # 政策原文：site: 限定到 gov.cn，出来的是部委和地方政府自己的发布。
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/search?q=site:gov.cn+when:24h&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: gn-health-zh
    type: rss
    weight: 0.7
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/topics/CAAqJQgKIh9DQkFTRVFvSUwyMHZNR3QwTlRFU0JYcG9MVU5PS0FBUAE?hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: gn-food
    type: rss
    weight: 0.7
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/search?q=食品安全+OR+药品+OR+抽检+OR+召回+when:24h&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: gn-edu
    type: rss
    weight: 0.6
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/search?q=教育+OR+高考+OR+义务教育+OR+招生+when:24h&hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

  - name: gn-science-zh
    type: rss
    weight: 0.5
    stripPatterns: *gn-strip
    params:
      url: 'https://news.google.com/rss/topics/CAAqKggKIiRDQkFTRlFvSUwyMHZNRFp0Y1RjU0JYcG9MVU5PR2dKRFRpZ0FQAQ?hl=zh-CN&gl=CN&ceid=CN:zh-Hans'
      limit: 40

sections:
  # 两组栏目，被 schedules 的白名单分开跑（docs/NEWS-EDITION.md 决策 1）：
  #   技术早晚报（morning / evening）= tech 6 + ai 4 + cn-tech 5 + security 2 = 每期上限 17 条
  #                                     （releases 已 enabled: false，它的 3 席不计）
  #   要闻期（news-am / news-pm）      = news 12 + cn-news 10 + cn-life 8 = 每期上限 30 条
  # 低频源常年空栏，技术那三栏实际稳定在 15–20 条。
  # 想要更短就调 limit，不要删源 —— 源多是好事，`limit` 才是长度旋钮。
  # 改了下面任何一个 limit，记得回来把这行的数字也改掉。
  - id: tech
    title: 国际技术
    sources:
      [
        hn-front,
        gh-trending-ts,
        lobsters,
        bytebytego,
        infoq-arch,
        martinfowler,
        pragmatic-engineer,
        react-blog,
        chrome-dev,
        web-dev,
        ts-devblog,
        css-tricks,
        github-changelog,
        cloudflare,
        kubernetes,
        verge,
        ars-technica,
      ]
    limit: 6
    minPerSource: 1 # keep HN from eating the whole section
    include: [] # empty = no include filter
    exclude: ['crypto', 'NFT', 'web3', 'memecoin']

  - id: ai
    title: AI 工程
    sources: [simonwillison, openai, google-ai, deepmind, huggingface, latent-space, anthropic]
    # 5 → 7 个源，limit 跟着 3 → 4，否则新源只会稀释轮换池而挤不进来。
    # anthropic 试运行结束若不留，这里调回 3。
    limit: 4
    minPerSource: 1

  - id: cn-tech
    title: 中文技术
    sources:
      [solidot, oschina, infoq-cn, ruanyifeng, meituan-tech, zhangxinxu, juejin, 36kr-ai, sspai]
    # 试运行 36kr-ai 期间放到 5，好让新源有机会露面被评估；试完不留就调回 4。
    limit: 5
    minPerSource: 1

  - id: security
    title: 安全公告
    sources: [cisa-advisories, hacker-news-sec, krebs]
    limit: 2
    minPerSource: 1
    # CISA 的 all.xml 以工控 / ICS 为主，与我的技术栈无关。按标题词排除 —— 光排
    # 「ICS Advisory」不够：实测漏掉了「…Threat to Siemens S7 Series PLCs」这种。
    exclude:
      ['ICS Advisory', 'ICS Medical', 'Industrial Control', 'PLC', 'SCADA', 'Siemens', 'Rockwell']

  - id: releases
    title: 依赖发版
    # 关栏而不是删配置：8 个 release 源保持声明（`--sections releases` 仍然校验得过），
    # 它们只是不再被任何启用的栏引用，因而整轮不发一次 HTTP 请求、也不再产生 staleAfterDays 告警。
    # 关掉的理由：发版消息的标题即全部信息（"v4.1.1"），正文永远读不出增量，却要占 3 个席位。
    # 回滚就是把这一行改回 true —— 不需要重新生成 cron，不需要迁移归档。
    enabled: false
    sources:
      [
        nextjs-releases,
        react-releases,
        typescript-releases,
        node-releases,
        spring-boot-releases,
        pnpm-releases,
        vitest-releases,
        eslint-releases,
      ]
    # 5 → 8 个源，limit 跟着 2 → 3。发版消息价值高度依赖时效，宁可多给一个席位。
    limit: 3
    minPerSource: 1
    # 预发布版本一天能出好几个（next.js 的 canary 尤其密），会把真正该看的稳定版挤掉。
    exclude: ['canary', 'nightly', '-rc', '-alpha', '-beta', 'SNAPSHOT']

  # ── 要闻期专用的三栏（docs/NEWS-EDITION.md §1.2）────────────────────────────
  # limit 贴着源数，是有意的：minPerSource: 1 让席位先按「每源保底一条」发放，
  # limit 一旦大于源数，多出来的席位就全给排名最高的那个源连发 —— 把「面」换成
  # 「同一家媒体刷屏」，而重大新闻要的恰恰是面。所以源数就是 limit 的天然上限，
  # 想更长只能加源。留 2 席差额是给轮换的余量：低频源有机会顶上来。
  #
  # 两期共用这三栏，所以早间 / 晚间的条数必然相同 —— limit 是 section 的属性，
  # 不是 schedule 的。要区分就得建两套 section（id 不能重复），暂不做。

  # id 保持 `news` / `cn-news` 不变：已归档的 2026-08-20 那期用的就是这两个 id，
  # 改名会让 `--from-archive` 重发时丢掉整栏。
  - id: news
    title: 国际要闻
    sources:
      [
        bbc-zhongwen,
        nyt-cn,
        rfi-zh,
        un-news-zh,
        bbc-world,
        guardian-world,
        nyt-world,
        aljazeera,
        nyt-home,
        npr-news,
        ft-world,
        economist-week,
        gn-world-zh,
        un-news-en,
      ]
    limit: 12
    minPerSource: 1

  - id: cn-news
    title: 国内要闻
    sources:
      [
        chinanews-import,
        chinanews-china,
        jiemian,
        thepaper,
        chinanews-finance,
        cna-zh,
        gn-nation-zh,
        scmp-china,
        gn-business-zh,
        yahoo-hk,
        gnews-cn,
      ]
    limit: 10
    minPerSource: 1

  - id: cn-life
    title: 民生·社会
    sources:
      [
        chinanews-society,
        chinanews-life,
        gn-minsheng,
        gn-disaster,
        gn-govcn,
        gn-health-zh,
        gn-food,
        gn-edu,
        gn-science-zh,
      ]
    limit: 8
    minPerSource: 1

archive:
  enabled: true
  dir: archive # committed to the DEFAULT branch — this is also what keeps the cron alive
  indexKeep: 30 # index.md lists the last 30 issues; the files themselves are kept forever
  commit: true # set false (or pass --no-commit) when running locally
  dedupeLookbackDays: 14 # cross-day dedupe reads this many days of archived JSON

render:
  # 源摘要的字符预算。normalize 会在预算内退到最后一个完整句子，退不动才补省略号，
  # 所以这个数字是「最多」而不是「一定」—— 实际长度按句子落点浮动。
  excerptMaxChars: 300
  # detail: compact 的收件人（默认所有推送渠道）每条给多少字。
  # 企微一条消息 4096 字节、中文一字三字节，M2 的摘要变长之后，不设这个数就是
  # 早上五条手机通知。100 字 ≈ 一句话，正好够判断「值不值得去邮箱看全文」。
  # 同样按句子边界截断，不会断在半句上。
  compactMaxChars: 100

dedupe:
  # 跨源同题去重：标题归一化后取字符 4-gram，算 Dice 系数，>= 这个值就判为同一条。
  # 阈值不是拍的 —— 用 08-20/08-21 两期归档（43 条标题）实测：
  #   真重复（oschina 与 36kr-ai 转载同一条 DeepSeek Harness 新闻）  0.286
  #   最高的无关配对（两条毫不相干的英文技术文）                      0.086
  # 0.2 落在这 3.3 倍的间距中间。用 4-gram 而不是 3-gram：n=3 时间距收窄到
  # 0.306 vs 0.153，n=2 时直接反转（0.341 vs 0.444），那会开始误杀真新闻。
  # 这个检查依赖 sources[].stripPatterns 先把标题里的固定后缀去掉：`- thepaper.cn`
  # 这种共享后缀本身就能刷到 0.327，比真重复还高。
  # 置 0 关闭，只保留完全相同标题的老行为。
  titleSimilarity: 0.2

# ── LLM 摘要（§2）──────────────────────────────────────────────────────────────
# 白名单式：默认谁都不调用，只有在下面被显式打开的 section / source 才会走模型。
#
# enabled: true 并不等于「会花钱」。密钥没配的时候整段自动跳过，早报照常出，
# 只在 Actions 运行页多一行「未配置密钥」。所以这里可以先开着，等哪天把
# LLM_API_KEY 加进仓库 secrets，它自己就开始工作了。
#
# ★ 当前是 M2：打开 fetchFullText 的栏目/源会真的去把原文抓回来喂给模型，
#   这才是「读完就懂、不用点链接」的那一步（文档 §0.2 / 决策 7）。抓不到就退回
#   excerpt，早报照常出，只在运行页和 warnings 里留一行。
llm:
  enabled: true

  provider:
    # 换供应商不需要改代码，也不需要改这里：LLM_BASE_URL（secret）+ LLM_MODEL（vars）
    # 覆盖下面两行，二者必须成对改 —— 只换端点会让旧模型名每天早上 404。
    baseUrl: https://api.deepseek.com/v1 # 任何 OpenAI 兼容端点；LLM_BASE_URL 可覆盖
    # deepseek-chat 这个别名已于 2026-07-24 下线，留着就是每天四个 404。
    model: deepseek-v4-flash # LLM_MODEL 可覆盖
    apiKeyRef: LLM_API_KEY # 写的是 secret 的「名字」，与 recipients.secretRef 同一约定
    temperature: 0 # 同样的输入永远给同样的输出，便于 --re-enrich 比对
    maxOutputTokens: 300
    timeoutMs: 30000
    concurrency: 4 # LLM_CONCURRENCY 可覆盖；限流是密钥的属性，不是代码的属性
    retries: 2 # 只对 429 / 5xx / 超时重试；401 之类重试三遍只是白等

    # 厂商扩展参数，原样并入请求体。工具调用（tools / tool_choice）三家都是标准 OpenAI
    # 形状，加了不用改代码；但思考模式各写各的，所以才需要这一格 —— 有了它，
    # 「换哪个模型」是一行配置，不是一次改代码。
    #   DeepSeek：extraBody: { thinking: { type: enabled }, reasoning_effort: low }
    #   通义：    extraBody: { enable_thinking: true, thinking_budget: 2048 }
    #   智谱：    extraBody: { thinking: { type: enabled } }
    # ⚠️ 真要开思考模式，maxOutputTokens 必须同步抬到 2000+（思维链也算输出 token，
    #    300 的上限会让模型「想完没预算写答案」），timeoutMs 也要放宽。
    # model / messages / temperature / max_tokens / stream 这五个键会被配置校验拒绝：
    # 前四个 provider 自己管，stream 会让 llm.ts 把 SSE 当成「非 JSON 响应」整期退回 excerpt。
    extraBody: {}

  # 硬闸。section.limit 相加（技术早晚报 17、要闻期 30）已经是结构性上限，
  # 这里是配置写错时兜底的第二道，两者取小。
  budget:
    # 12 → 24：额度按栏目顺序发放，早报里 tech(3) + ai(3) + cn-tech(3) + security(2) = 11，
    # 12 这个值等于把排在后面的栏目饿死。不会涨钱：实际用量仍被 when.topPerSection: 3
    # 卡在「栏目数 × 3」（技术早晚报 12 条、要闻期 9 条），24 只是不再提前截断。
    maxItemsPerRun: 24
    maxInputCharsPerItem: 6000 # 正文按这个字符数截断；一篇技术文的前 6000 字足够摘要
    # 开了 fetchFullText 的条目按 maxInputCharsPerItem 「预订」额度（抓之前还不知道
    # 正文多长），所以这个数至少要 >= maxItemsPerRun × maxInputCharsPerItem = 72000，
    # 否则条数还没到 12，字符闸就先把后面的条目挡掉了 —— 运行页的「字符闸 N 条」会报出来。
    maxTotalInputChars: 80000

  # 抓正文。超时与抓 feed 分开（文档 §8 第 8 行）：feed 一秒就回，
  # 带同意弹窗的新闻站不会，一个慢页面不该占掉模型的时间预算。
  extract:
    timeoutMs: 15000
    maxHtmlChars: 2000000
    maxRedirects: 3 # 每一跳都会重新做一次私网地址检查（§6.2 第 3 条）
    minChars: 200 # 抓出来比这还短 = 撞上付费墙 / JS 壳，退回 excerpt 更划算
    concurrency: 4

  defaults:
    summarize: false # 白名单：没被点名的一律不调用
    style: bullet # bullet | oneline | tldr
    language: zh-CN # 英文源直接产出中文
    maxChars: 180
    fetchFullText: false # 白名单：只有下面点名的栏目/源才会去抓正文

  # 最具体的胜出：source > section > defaults。
  sections:
    tech: { summarize: true, fetchFullText: true }
    ai: { summarize: true, fetchFullText: true, maxChars: 220 }
    news: { summarize: true, style: oneline, maxChars: 120 } # 要闻只要一句话，不值得抓正文
    # 两个中文要闻栏同样只要一句话。注意：LLM_API_KEY 没配的时候这三行全都不生效，
    # 国际栏进邮件就是原样英文 excerpt —— 这正是 sources 里中文源被压在英文源之上的原因。
    cn-news: { summarize: true, style: oneline, maxChars: 120 }
    cn-life: { summarize: true, style: oneline, maxChars: 120 }
    # 中文栏 M2 才打开：只喂 excerpt 的改写对中文源等于换个说法，抓正文才有信息量。
    cn-tech: { summarize: true, fetchFullText: true }
    security: { summarize: true, style: oneline } # 安全公告本身就是结构化的，抓正文没意义

  sources:
    lobsters: { summarize: true, fetchFullText: true } # excerpt 只有一个 "Comments"
    hn-front: { summarize: true, fetchFullText: true } # excerpt 是 points / comments
    infoq-cn: { summarize: true, fetchFullText: true } # excerpt 是「点击查看原文」
    gh-trending-ts: { summarize: false } # repo description 已经是一句话摘要
    cisa-advisories: { summarize: false } # 结构化公告，改写只会丢掉编号和版本范围

  # 质量闸，与上面的开关正交：开关回答「这类内容值不值得花钱」，
  # 这里回答「这一条的原始摘要是不是已经够用了」。
  when:
    excerptShorterThan: 80 # 源摘要够长 -> 不调用
    excerptMatches: # 已知的垃圾 excerpt 指纹（stripPatterns 清完通常会变成空串，空串一律放行）
      - '^Comments$'
      - '点击查看原文'
      - '阅读全文'
      - 'appeared first on'
      - '^Read more'
    topPerSection: 3 # 每栏只给前 3 条上模型，尾部保留源摘要
    # titleLanguageNot: zh
    # ↑ 故意不开。它与上面的 sections 开关是「与」的关系，一旦设成 zh，
    #   将来给 cn-tech 打开 summarize 会被它静默抵消，查起来很费劲。

  # 全刊导读（文档 §5.3 / M3）：整期只调用一次，读者感知最强的一块。
  # 它读的是「这一期最终长什么样」——条目摘要跑完之后才生成，所以它介绍的是
  # 收件人真正拿到的那一期，而不是抓回来的原始 feed。
  # 失败不写导读、不改 exitCode，其余部分照常送达（§6.1）。
  digest:
    enabled: true
    sentences: 3 # 提示词里要求的句数；真正兜底的是下面的 maxChars
    position: top # top | bottom
    maxChars: 240 # 模型不听话写了八句时的硬截断，不是拒收的理由
    maxItems: 24 # 喂前 24 条；一栏的尾巴对「今天讲什么」没有贡献
    maxCharsPerItem: 120 # 每条只喂标题 + 120 字，整个导读的输入约 2–3k 字符

# ── 周报（文档 §9 M3）────────────────────────────────────────────────────────────
# 零抓取：读 archive/ 里已经提交的日报 JSON，按 rankScore 重排，每栏取前几条。
# 条目里的 LLM 摘要是早报那天已经付过钱的，这里不会再调一次模型 —— 唯一可能的
# 调用是「本周导读」那一次（受 digest 与 llm.digest.enabled 双重控制）。
# 照常归档：文件名带 .weekly 后缀（2026-08-24.weekly.json），和当天的早报并排放，
# 也会出现在静态站上。条目是重印，但「本周导读」那段话只存在于这里。
# 代价是：读「某一天发了什么」的地方（跨天去重、下一期周报自己）必须跳过这个 slot。
# 改了 weekday / time 之后同样必须跑 `pnpm brief:schedule`。
weekly:
  enabled: true
  title: 每周回顾
  weekday: 1 # ISO：1=周一 … 7=周日
  # 08:20 CST = 00:20 UTC 当天，生成的 cron 是 `20 0 * * 1`。
  # 原本是 08:00，也就是 `0 0 * * 1` —— UTC 整点，GitHub 文档点名的最拥挤时刻。
  # 实测 2026-08-24 那次周报晚了 56 分钟，是所有档期里第二差的。往后挪 20 分钟
  # 让出整点，送达时间几乎不变。度量口径见 docs/SCHEDULE-DRIFT.md。
  time: '08:20'
  days: 7 # 往回读 7 天（含当天）
  limitPerSection: 5 # 每栏最多 5 条；周报是回顾，不是第二份归档
  # ★ 白名单，与 schedules 里的那两处同源（决策 4）：不写死就会把 7 天的新闻卷进来，
  # 三个新闻栏 × limitPerSection 5 = 每周多出 15 条时政，周报是技术回顾。
  sections: [tech, ai, cn-tech, security, releases]
  # 只发邮件。周报是「坐下来读」的东西，把 30 条推到手机上只会被划掉 ——
  # 这也是 weekly.recipients 默认为空、必须显式点名的原因。
  recipients: [me-mail]
  digest: true # 本周导读；与 llm.digest.enabled 是「与」的关系

recipients:
  - id: me-wecom
    channel: wecom
    secretRef: WECOM_WEBHOOK_ME # the NAME of the secret, never the webhook itself
    sections: ['*']
    format: markdown
    # 标题 + 一句话（render.compactMaxChars），不给要点。所有推送渠道默认就是
    # compact，这里写出来是为了让「手机上为什么比邮件短」有个明确的答案。
    detail: compact
    enabled: true

  # One entry, one message. Nobody's address is committed — both header lines come
  # from secrets, and the recipient is skipped (not failed) while EMAIL_TO is unset:
  #   EMAIL_TO = you@example.com                    -> the To: header, normally one address
  #   EMAIL_CC = ["a@example.com","b@example.com"]  -> the Cc: header; JSON array or a,b
  # `to`/`cc` may also be set here instead, but then they live in git; the secrets win.
  - id: me-mail
    channel: email
    driver: smtp # smtp (Gmail App Password) | resend (only with a verified custom domain)
    sections: ['*']
    format: html
    detail: full # 标题 + 摘要 + 要点 + 折叠起来的原文摘要（文档 §5.3）
    enabled: true

  - id: backup-serverchan
    channel: serverchan
    secretRef: SERVERCHAN_KEY
    sections: [tech, ai, security]
    format: markdown
    enabled: false

# ── 一文多发（docs/PUBLISH.md）────────────────────────────────────────────────────
# 只读归档、绝不重跑 pipeline：不抓取、不调 LLM、不发推送。发布时刻由 publish.yml
# 自己的 cron 决定（决策 3），与早报什么时候跑完无关；代价是「cron 到点归档还没
# 就绪」变成我方要处理的情况，靠 catchUpDays 次日自动补（§1.3）。
# 改了 time / weekday 之后必须跑 `pnpm publish:schedule`，否则 CI 的 check:schedule 会红。
publish:
  enabled: true

  # 首发地。留空则从 GITHUB_REPOSITORY 推导 https://<owner>.github.io/<repo>。
  # 换域名时用仓库变量 PUBLISH_CANONICAL_BASE 覆盖，不用改这里。
  canonicalBase: ''

  # ★ 外发栏目白名单（决策 4）。以后新增 finance / culture 之类的栏目，默认不外发 ——
  # 黑名单会默认放行，白名单会默认拦住，外发内容的默认值必须是「不发」。
  include: [tech, ai, cn-tech, security, releases]

  schedules:
    - id: daily
      # 必须晚于晚报 20:10：窗口右边界就是发布日当天，09:30 那一刻当天的 evening
      # 还不存在，合并两期就退化成只发早报一半。1h20m 缓冲吸收 Actions 0–30 分钟漂移。
      time: '21:30'
      # ★ 级别 1：合并当天两期。实测单期技术 11–17 条，合并后 23–31 条（§0.4）。
      window: { days: 1, slots: [morning, evening] }
      titleTemplate: '{title} · 技术日报（{date}）'
      tags: [前端, 后端, AI]
      minItems: 8 # 低于此条数当天不发：宁可缺一期，也不发凑数文（决策 11）
      maxItems: 30
      backfillDays: 2 # 条数不够时往前扩几天，只捞没发过的
      catchUpDays: 2 # 归档晚到时，次日往回补
      skipWeekdays: [] # 填 [mon] 则周一只发周报
      enabled: true

    - id: weekly
      time: '10:30'
      weekday: mon
      # 直接取 weekly 那期归档 —— 它已经是 weekly.ts 做过编辑取舍的结果。
      # 不在这里重新聚合七天，那是把同一个判断做两次。
      window: { days: 1, slots: [weekly] }
      titleTemplate: '{title} · 本周技术周报（{range}）'
      tags: [周报, 前端, AI]
      minItems: 12
      maxItems: 40
      backfillDays: 0
      catchUpDays: 3
      enabled: true

  targets:
    # Tier 1：官方 token，长期有效、无风控、失败原因永远是明确的 HTTP 错误。
    - id: notion-archive
      platform: notion
      enabled: true
      schedules: ['*']
      secretRef: NOTION_TOKEN
      notion:
        # 二选一。数据库模式推荐；填数据库 ID 也行，适配器会解析成 data_source（§5.1）。
        dataSourceRef: NOTION_DATA_SOURCE_ID
        pageRef: '' # 页面模式：作为子页面挂在某个固定页下，完全绕开 data source 的演进
        # 属性名必须与 Notion 里的列名逐字一致，错了会报 validation_error。
        properties:
          title: Name
          date: Date
          line: Line
          summary: Summary
          tags: Tags
          url: Source
      # Notion 没有草稿态，创建即可见；写死 true 只是让语义统一。
      autoPublish: true

    # Tier 2：网页端登录态，没有官方开放发布 API，接口随时可能变（§6.1）。
    - id: juejin
      platform: juejin
      enabled: true
      schedules: [daily, weekly]
      secretRef: JUEJIN_COOKIE
      # 决策 10：试运行期只到草稿箱。转 true 的条件见 §6.5（连续 10 期无异常）。
      autoPublish: false
      failStreakLimit: 3 # 连续 3 次失败即熔断 —— 在风控里反复撞墙只会更糟
      footer: true
      juejin:
        # 不可猜，也不要从别人的文章里抄：按 §6.3 从浏览器实抓一次。
        categoryId: '6809637767543259144' # 前端
        tagIds: ['6809640407484334093', '6809641083107016712'] # 前端 / 资讯
        syncToOrg: false
      overrides:
        weekly:
          tags: [周报, 前端]
          juejin:
            tagIds: ['6809640407484334093'] # 周报只挂一个主标签


    # ---- TODO（§12）：抽象验完再开 ----
